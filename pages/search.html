<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - MiniSocial</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (!localStorage.getItem('token') || !JSON.parse(localStorage.getItem('user') || '{}')._id) {
      window.location.replace('/pages/login.html');
    }
  </script>
  <style>
    :root {
      --ig-black: #262626;
      --ig-gray-dark: #8e8e8e;
      --ig-gray-light: #dbdbdb;
      --ig-border: #dbdbdb;
      --ig-bg: #fafafa;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --ig-red: #ed4956;
      --bottomnav-h: 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ig-bg);
      color: var(--ig-black);
      -webkit-font-smoothing: antialiased;
      padding-bottom: var(--bottomnav-h);
    }
    button, input { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    .hidden { display: none !important; }

    /* ============ APP LAYOUT ============ */
    .app-layout { display: block; }
    .app-main { min-width: 0; }

    /* ============ DESKTOP LEFT SIDEBAR ============ */
    .desktop-sidebar { display: none; flex-direction: column; background: #fff; }
    .sidebar-logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic; font-weight: 400; font-size: 28px;
      padding: 14px 12px 26px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .sidebar-nav-item {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 12px; border-radius: 8px; font-size: 16px;
      color: var(--ig-black); cursor: pointer; position: relative; border: none; background: none; text-align: left; width: 100%;
    }
    .sidebar-nav-item:hover { background: var(--ig-bg); }
    .sidebar-nav-item.active { font-weight: 700; }
    .sidebar-icon { font-size: 22px; width: 24px; text-align: center; flex-shrink: 0; }
    .sidebar-icon.notif-dot::after {
      content: ""; position: absolute; top: 8px; left: 30px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ig-red); border: 1.5px solid #fff;
    }
    .sidebar-avatar-icon {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--ig-gray-light) center/cover no-repeat; flex-shrink: 0;
    }
    .sidebar-more { margin-top: auto; }

    /* ============ MOBILE TOP BAR (search input lives here on mobile) ============ */
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--ig-border);
      position: sticky; top: 0; z-index: 50;
    }

    /* ============ SEARCH BOX ============ */
    .search-box-wrap { flex: 1; position: relative; }
    .search-box {
      width: 100%;
      background: var(--ig-bg);
      border: none;
      border-radius: 10px;
      padding: 9px 34px 9px 34px;
      font-size: 14px;
      outline: none;
    }
    .search-box::placeholder { color: var(--ig-gray-dark); }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--ig-gray-dark); font-size: 14px; pointer-events: none;
    }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: var(--ig-gray-light); color: #fff; border: none;
      width: 18px; height: 18px; border-radius: 50%; font-size: 11px;
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    .search-box-wrap.has-text .search-clear { display: flex; }

    /* ============ SEARCH SHELL ============ */
    .search-shell { max-width: 630px; margin: 0 auto; padding: 0; }

    .search-panel { background: #fff; }

    /* Desktop-only in-page search box (sidebar search opens this like IG's flyout) */
    .desktop-search-header {
      display: none;
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--ig-border);
      background: #fff;
    }
    .desktop-search-header h2 { font-size: 18px; margin: 0 0 12px; }

    /* ============ RECENT LIST ============ */
    .search-section-heading {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 4px;
      font-size: 14px; font-weight: 600;
    }
    .search-section-heading .clear-all { font-size: 13px; font-weight: 600; color: var(--ig-blue); cursor: pointer; }

    .search-result-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; cursor: pointer;
    }
    .search-result-item:hover { background: var(--ig-bg); }
    .search-result-user { display: flex; align-items: center; gap: 12px; }
    .search-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: #eee center/cover no-repeat; flex-shrink: 0;
    }
    .search-result-text strong { display: block; font-size: 14px; font-weight: 600; }
    .search-result-text span { font-size: 13px; color: var(--ig-gray-dark); }
    .search-result-remove {
      background: none; border: none; font-size: 16px; color: var(--ig-gray-dark);
      cursor: pointer; padding: 6px;
    }

    .search-empty {
      text-align: center; padding: 50px 24px; color: var(--ig-gray-dark); font-size: 14px;
    }

    /* ============ EXPLORE GRID (shown when search box is empty) ============ */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 8px;
    }
    .explore-grid .explore-item:nth-child(9n+4),
    .explore-grid .explore-item:nth-child(9n+8) {
      grid-row: span 2;
      grid-column: span 2;
    }
    .explore-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #eee;
      overflow: hidden;
      cursor: pointer;
    }
    .explore-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .explore-badge {
      position: absolute; top: 8px; right: 8px; color: #fff; font-size: 15px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    /* ============ MOBILE BOTTOM NAV ============ */
    .mobile-bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottomnav-h);
      background: #fff; border-top: 1px solid var(--ig-border);
      display: flex; align-items: center; justify-content: space-around;
      z-index: 50; font-size: 22px;
    }
    .mobile-bottom-nav a { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--ig-black); }
    .mobile-bottom-nav a.active { font-weight: 700; }
    .mobile-bottom-nav .nav-profile-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--ig-gray-light) center/cover no-repeat; border: 1.5px solid var(--ig-black);
    }

    /* ==================================================================
       DESKTOP LAYOUT (>= 768px)
       ================================================================== */
    @media (min-width: 768px) {
      body { padding-bottom: 0; }
      .mobile-topbar, .mobile-bottom-nav { display: none; }

      .app-layout { display: flex; align-items: flex-start; }
      .desktop-sidebar {
        display: flex; width: 245px; flex-shrink: 0; height: 100vh;
        position: sticky; top: 0; border-right: 1px solid var(--ig-border);
        padding: 8px 12px 16px;
      }
      .app-main { flex: 1; display: flex; justify-content: center; }

      .search-shell { max-width: 630px; padding: 30px 20px 60px; }
      .desktop-search-header { display: block; border: 1px solid var(--ig-border); border-radius: 8px 8px 0 0; }
      .search-panel { border: 1px solid var(--ig-border); border-top: none; border-radius: 0 0 8px 8px; min-height: 200px; }
      .explore-grid { margin-top: 24px; gap: 24px; }
    }
  </style>
</head>
<body>

  <div class="app-layout">

    <!-- ============ DESKTOP LEFT SIDEBAR ============ -->
    <aside class="desktop-sidebar">
      <div class="sidebar-logo">MiniSocial</div>
      <nav class="sidebar-nav">
        <a class="sidebar-nav-item" href="/pages/home.html"><span class="sidebar-icon">⌂</span> Home</a>
        <button class="sidebar-nav-item active" onclick="document.getElementById('search-input').focus()"><span class="sidebar-icon">⌕</span> Search</button>
        <a class="sidebar-nav-item" href="/pages/profile.html"><span class="sidebar-avatar-icon" id="sidebar-avatar"></span> Profile</a>
        <button class="sidebar-nav-item sidebar-more" type="button" onclick="confirmDeleteAccount()"><span class="sidebar-icon">↪</span> Logout</button>
      </nav>
    </aside>

    <div class="app-main">

      <!-- ============ MOBILE TOP BAR ============ -->
      <header class="mobile-topbar">
        <div class="search-box-wrap" id="mobile-search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" class="search-box" id="search-input-mobile" placeholder="Search" oninput="handleSearchInput(this.value)" autocomplete="off">
          <button class="search-clear" onclick="clearSearch('search-input-mobile')">×</button>
        </div>
      </header>

      <main class="search-shell">

        <!-- Desktop-only search header (mirrors IG's search flyout title) -->
        <div class="desktop-search-header">
          <h2>Search</h2>
          <div class="search-box-wrap" id="desktop-search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" class="search-box" id="search-input" placeholder="Search by username" oninput="handleSearchInput(this.value)" autocomplete="off">
            <button class="search-clear" onclick="clearSearch('search-input')">×</button>
          </div>
        </div>

        <section class="search-panel">
          <!-- Recent searches (shown when search box is empty) -->
          <div id="recent-section">
            <div class="search-section-heading">
              <span>Recent</span>
              <span class="clear-all" onclick="clearAllRecent()">Clear all</span>
            </div>
            <div id="recent-list"></div>
          </div>

          <!-- Live results (shown while typing) -->
          <div id="results-section" class="hidden">
            <div id="results-list"></div>
          </div>
        </section>

        <!-- Explore grid (shown under recent searches, like IG's explore tab) -->
        <div id="explore-grid" class="explore-grid"></div>

      </main>

      <!-- ============ MOBILE BOTTOM NAV ============ -->
      <nav class="mobile-bottom-nav">
        <a href="/index.html" title="Home">⌂</a>
        <a href="#" class="active" title="Search">⌕</a>
        <a href="#" onclick="chooseMedia && chooseMedia('post')" title="Create">⊕</a>
        <a href="/reels.html" title="Reels">▶</a>
        <a href="/profile.html" title="Profile"><span class="nav-profile-dot" id="bottomnav-avatar"></span></a>
      </nav>

    </div>
  </div>

  <script>
    /* ==========================================================
       DEMO DATA — replace with a real API call, e.g.:
       async function searchUsers(query) {
         const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
         return res.json();
       }
       ========================================================== */
    const demoUsers = [
      { username: 'huzaifaabbasi630', name: 'Huzaifa Abbasi', avatar: '' },
      { username: 'calvarymagazine', name: 'Calvary Magazine', avatar: '' },
      { username: 'jonathan_talley_', name: 'Jonathan Talley', avatar: '' },
      { username: 'johnnyolth', name: 'Johnny Olth', avatar: '' },
      { username: 'theoriginalavery', name: 'Avery', avatar: '' },
      { username: 'thejakeman', name: 'Jake', avatar: '' },
      { username: 'cthurmanrea', name: 'C. Thurman', avatar: '' },
      { username: 'border_wulf', name: 'Border Wulf', avatar: '' },
      { username: 'amazinglegendkun', name: 'Legend Kun', avatar: '' },
      { username: 'the_first_turtle', name: 'The First Turtle', avatar: '' },
    ];

    // Recent searches persisted for this browser only (swap for a real per-user API list)
    let recentSearches = JSON.parse(localStorage.getItem('minisocial_recent_searches') || '[]');

    function saveRecent() {
      localStorage.setItem('minisocial_recent_searches', JSON.stringify(recentSearches));
    }

    function renderRecent() {
      const list = document.getElementById('recent-list');
      const heading = document.querySelector('#recent-section .search-section-heading');
      if (!recentSearches.length) {
        heading.classList.add('hidden');
        list.innerHTML = `<div class="search-empty">No recent searches.</div>`;
        return;
      }
      heading.classList.remove('hidden');
      list.innerHTML = recentSearches.map(u => `
        <div class="search-result-item" onclick="openProfile('${u.username}')">
          <div class="search-result-user">
            <div class="search-avatar" style="${u.avatar ? `background-image:url('${u.avatar}')` : ''}"></div>
            <div class="search-result-text">
              <strong>${u.username}</strong>
              <span>${u.name}</span>
            </div>
          </div>
          <button class="search-result-remove" onclick="event.stopPropagation(); removeRecent('${u.username}')">×</button>
        </div>
      `).join('');
    }

    function renderResults(query) {
      const list = document.getElementById('results-list');
      const matches = demoUsers.filter(u =>
        u.username.toLowerCase().includes(query.toLowerCase()) ||
        u.name.toLowerCase().includes(query.toLowerCase())
      );
      if (!matches.length) {
        list.innerHTML = `<div class="search-empty">No results found for "${query}"</div>`;
        return;
      }
      list.innerHTML = matches.map(u => `
        <div class="search-result-item" onclick="openProfile('${u.username}')">
          <div class="search-result-user">
            <div class="search-avatar" style="${u.avatar ? `background-image:url('${u.avatar}')` : ''}"></div>
            <div class="search-result-text">
              <strong>${u.username}</strong>
              <span>${u.name}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function handleSearchInput(value) {
      // keep both mobile + desktop inputs in sync
      const mobileInput = document.getElementById('search-input-mobile');
      const desktopInput = document.getElementById('search-input');
      if (mobileInput && mobileInput.value !== value) mobileInput.value = value;
      if (desktopInput && desktopInput.value !== value) desktopInput.value = value;

      document.getElementById('mobile-search-wrap')?.classList.toggle('has-text', value.length > 0);
      document.getElementById('desktop-search-wrap')?.classList.toggle('has-text', value.length > 0);

      const trimmed = value.trim();
      const recentSection = document.getElementById('recent-section');
      const resultsSection = document.getElementById('results-section');
      const exploreGrid = document.getElementById('explore-grid');

      if (trimmed.length === 0) {
        recentSection.classList.remove('hidden');
        resultsSection.classList.add('hidden');
        exploreGrid.classList.remove('hidden');
      } else {
        recentSection.classList.add('hidden');
        resultsSection.classList.remove('hidden');
        exploreGrid.classList.add('hidden');
        renderResults(trimmed);
        // TODO: swap renderResults(trimmed) for an async call to your real search endpoint
      }
    }

    function clearSearch(inputId) {
      const input = document.getElementById(inputId);
      input.value = '';
      handleSearchInput('');
      input.focus();
    }

    function removeRecent(username) {
      recentSearches = recentSearches.filter(u => u.username !== username);
      saveRecent();
      renderRecent();
    }

    function clearAllRecent() {
      recentSearches = [];
      saveRecent();
      renderRecent();
    }

    function openProfile(username) {
      const user = demoUsers.find(u => u.username === username) || { username, name: '' };
      if (!recentSearches.find(u => u.username === username)) {
        recentSearches.unshift(user);
        recentSearches = recentSearches.slice(0, 10);
        saveRecent();
      }
      // TODO: navigate to the real profile route in your app, e.g.:
      window.location.href = `/profile.html?user=${encodeURIComponent(username)}`;
    }

    function renderExploreGrid() {
      const grid = document.getElementById('explore-grid');
      const items = Array.from({ length: 21 }, (_, i) => ({
        img: `https://picsum.photos/seed/explore${i}/400/400`,
        isVideo: i % 5 === 0,
        isCarousel: i % 7 === 0,
      }));
      grid.innerHTML = items.map(item => `
        <div class="explore-item">
          <img src="${item.img}" alt="Explore post">
          ${item.isVideo ? '<span class="explore-badge">▶</span>' : ''}
          ${item.isCarousel ? '<span class="explore-badge">▣</span>' : ''}
        </div>
      `).join('');
    }

    renderRecent();
    renderExploreGrid();
  </script>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
