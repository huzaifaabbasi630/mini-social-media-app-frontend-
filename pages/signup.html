<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MiniSocial</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('token') && JSON.parse(localStorage.getItem('user') || '{}')._id) {
      window.location.replace('/pages/profile.html');
    }
  </script>
</head>
<body>
  <div class="navbar">
    <div class="logo">Mini<span>Social</span></div>
    <nav>
      <a href="/pages/login.html">Login</a>
      <a href="/pages/signup.html" class="active">Sign Up</a>
    </nav>
  </div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Mini<span>Social</span></div>
      <p class="subtitle">Create your account</p>
      <form id="register-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required>
        </div>
        <div id="error-message" class="alert alert-danger hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="/pages/login.html">Sign In</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
