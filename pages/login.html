<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MiniSocial</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    if (localStorage.getItem('token') && JSON.parse(localStorage.getItem('user') || '{}')._id) {
      window.location.replace('/pages/profile.html');
    }
  </script>
</head>
<body>
  <div class="navbar">
    <div class="logo">Mini<span>Social</span></div>
    <nav>
      <a href="/pages/login.html" class="active">Login</a>
      <a href="/pages/signup.html">Sign Up</a>
    </nav>
  </div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Mini<span>Social</span></div>
      <p class="subtitle">Welcome back!</p>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <div id="error-message" class="alert alert-danger hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="/pages/signup.html">Sign Up</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).get('registered') === '1') {
      document.getElementById('error-message').className = 'alert alert-success';
      document.getElementById('error-message').textContent = 'Account created successfully. Please sign in.';
    }
  </script>
</body>
</html>
